[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdb-spark"
version = "0.5.6"
description = "GDB Graph Database Apache Spark Connector and Flight Loader"
readme = "README.md"
authors = [{ name = "GDB Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = [
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gdb_spark*"]
