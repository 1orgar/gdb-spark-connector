name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build JARs and Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Scala Thin JAR
        run: sbt package

      - name: Build Scala Fat/Assembly JAR
        run: sbt assembly

      - name: Build Python Distribution (Wheel & sdist)
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build python/

      - name: Stage Release Artifacts
        run: |
          mkdir -p dist_release
          # Copy sbt assembly fat jar
          find target -name "*assembly*.jar" -o -name "*spark*.jar" | while read -r jar; do
            cp "$jar" dist_release/
          done
          # Copy standard package jars
          find target -name "gdb-spark-connector*.jar" | while read -r jar; do
            cp "$jar" dist_release/
          done
          # Copy python distribution
          if [ -d "python/dist" ]; then
            cp python/dist/* dist_release/
          fi
          # Generate SHA256 checksums
          cd dist_release
          sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist_release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
